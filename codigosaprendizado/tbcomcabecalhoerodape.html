<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela com Cabeçalho e Rodapé</title>
</head>
<body>
    <h2>Tabela com Cabeçalho e Rodapé</h2>
    <table width="100%" border="3">
        <thead>
            <tr>
                <th>Mês</th>
                <th>Horas/Aula</th>
                </tr> <tbody> <tr>
                    <td>Junho</td>
                    <td>50</td>
                </tr>
                <tr>
                    <td>Julho</td>
                    <td>50</td>
                </tr>
                </tbody>
        <tfoot>
            <tr>
                <th>Total</th>
                <th>100</th>
            </tr>
        </tfoot>
    </table>
</body>
</head>
<body>
    <h2>Tabela Simples</h2>
    <!--Tabela com Colspan-->
    <table width="100%" border="3">
        <tr>
            <td>Aluno</td>
            <td colspan="2">Disciplina</td>
        </tr>
        <tr> 
            <td>Alex</tr>
            <td>HTML</td>
            <td>Ambiente Web</td>
        </tr>
        </table>
<!-- Tabela com Rowspan -->>
 <h2>Tabela com Rowspan</h2>
<table width="100%" border="2">
    <tr>
        <td>Aluno</td>
        <td rowspan="2">disciplina</td>
    </tr>
    <tr>
        <td>Alex</td>
        <td>HTML</td>
        <td>Ambiente Web</td>
    </tr>
</table>
